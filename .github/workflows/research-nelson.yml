name: Research Nelson food businesses
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Collect OpenStreetMap candidates
        run: python3 scripts/research_nelson.py
      - name: Commit research candidates (public repository)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/nelson-business-candidates.csv research/nelson-research-metadata.json
          git diff --cached --quiet || (git commit -m "Refresh Nelson business research candidates" && git push)
