name: Research Nelson branding
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  branding:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Build branding research queue
        run: python3 scripts/research_nelson_branding.py
      - name: Save research results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/nelson-branding-research.csv
          if ! git diff --cached --quiet; then
            git commit -m "Update Nelson branding research queue"
            git push
          fi
